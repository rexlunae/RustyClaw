[package]
name = "rustyclaw-core"
description = "Core library for RustyClaw — config, gateway protocol, secrets, tools, and shared types"
readme = "../../README.md"
keywords = ["ai", "agent", "llm", "openclaw", "automation"]
categories = ["development-tools", "text-processing"]
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["web-tools", "image-gen", "office-docs"]
web-tools = ["dep:scraper", "dep:html2md"]
browser = ["dep:chromiumoxide"]
mcp = ["dep:rmcp", "dep:schemars"]
matrix = ["chat-system/matrix"]
whatsapp = ["chat-system/whatsapp"]
qr = ["dep:image"]
# Text-to-image generation via provider APIs (OpenAI DALL-E, Google Imagen).
image-gen = []
# Text extraction from Office documents (DOCX, XLSX, PPTX) for the
# `document` tool. Pure Rust and small, so it is on by default — the
# alternative is `read_file` failing on these formats anywhere but macOS.
office-docs = ["dep:quick-xml", "dep:calamine"]
# Semantic vector memory (steel-memory → fastembed → ONNX Runtime).
# Heavy native dep that does not cross-compile (no armv7 ONNX binaries and
# the ort-sys build script breaks under cross); enabled by default in the
# gateway, which is the only component that runs it.
semantic-memory = ["dep:steel-memory"]
# CLI-based messengers (tier 1) - no heavy deps, just HTTP
signal-cli = ["chat-system/signal-cli"]
all-messengers = ["whatsapp", "signal-cli", "matrix"]
# Freenet and the apps on it (the `freenet`, `river`, and `atlas` tools).
# Off by default: it pulls in a WebSocket client, ed25519, and River's contract
# types. The tools stay registered either way and say so when it is off.
freenet = [
    "dep:freenet-stdlib",
    "dep:river-core",
    "dep:ciborium",
    "dep:ed25519-dalek",
    "dep:tokio-tungstenite",
]
full = [
    "web-tools",
    "browser",
    "mcp",
    "all-messengers",
    "semantic-memory",
    "image-gen",
    "freenet",
]

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
toml.workspace = true
anyhow.workspace = true
anyhow-tracing.workspace = true
thiserror.workspace = true
rand.workspace = true
chat-system.workspace = true
securestore.workspace = true
openssl-sys.workspace = true
totp-rs.workspace = true
qrcode.workspace = true
ssh-key.workspace = true
dirs.workspace = true
shellexpand.workspace = true
directories.workspace = true
tokio.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
clap.workspace = true
futures-util.workspace = true
reqwest.workspace = true
url.workspace = true
strum.workspace = true
sysinfo.workspace = true
which.workspace = true
glob.workspace = true
walkdir.workspace = true
rayon.workspace = true
zeroize.workspace = true
urlencoding.workspace = true
pulldown-cmark.workspace = true
chrono.workspace = true
zip.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
bincode.workspace = true
base64.workspace = true
regex.workspace = true
aho-corasick.workspace = true
oxidized-agentic-audit.workspace = true
ipnetwork.workspace = true
uuid.workspace = true
httpdate.workspace = true
colored.workspace = true
indicatif.workspace = true
unicode-width.workspace = true
rpassword.workspace = true

# Optional (browser only)
quick-xml = { workspace = true, optional = true }
calamine = { workspace = true, optional = true }
scraper = { workspace = true, optional = true }
html2md = { workspace = true, optional = true }
chromiumoxide = { workspace = true, optional = true }

# MCP (Model Context Protocol) client support
rmcp = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }

# Steel Memory - semantic vector search memory palace
# Keep git for local/dev; include version so publish can strip git and use crates.io.
steel-memory = { version = "0.1.3", optional = true }

# OpenHuman-derived helpers
# - tokenjuice: rule-driven compression of tool output before it hits the LLM
# - memory-tree: hierarchical summary-tree memory store for external data ingest
tokenjuice.workspace = true
memory-tree.workspace = true

# SSH transport (optional)
russh = { version = "0.61.2", features = ["async-trait"] }
rand_core = { version = "0.6.4" }
sha2 = { version = "0.11.0" }

# QR code generation (optional)
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

# Multi-provider LLM client. Backs the provider dispatch in
# `providers::genai_backend` (request building, tool calling, SSE streaming).
# Lives in core so every client crate that depends on rustyclaw-core shares
# the same instance rather than pulling a separate copy.
genai = "0.6.5"

# AST-grep — structural code search and rewrite via tree-sitter
ast-grep-core = "0.42.3"
ast-grep-language = "0.42.3"

# Freenet (optional; see the `freenet` feature).
# `net` gives freenet-stdlib its WebSocket client for the node's command API.
# ed25519-dalek is pinned to the 2.x line river-core uses, so keys and
# signatures are the same types on both sides rather than two silently
# incompatible copies.
freenet-stdlib = { version = "0.8.5", default-features = false, features = [
    "net",
], optional = true }
river-core = { version = "0.1.18", optional = true }
ciborium = { version = "0.2.2", optional = true }
ed25519-dalek = { version = "2.1", features = ["serde"], optional = true }
tokio-tungstenite = { version = "0.27", optional = true }
croner = "2"
chrono-tz = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_Pipes",
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"

[dev-dependencies]
tempfile = "3"
rcgen = "0.14"
